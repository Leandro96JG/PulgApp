name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Host (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/Pulgapp.sln

      - name: Run Windows unit & integration tests
        run: dotnet test windows/Pulgapp.sln --configuration Release --no-restore -p:Platform=x64

      - name: Publish self-contained Windows Server
        run: |
          dotnet publish windows/src/Pulgapp.Server.App/Pulgapp.Server.App.csproj `
            --configuration Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -o build/windows-publish

      - name: Compress Windows package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows-publish/* -DestinationPath Pulgapp-Server-win-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulgapp-Server-win-x64
          path: Pulgapp-Server-win-x64.zip
          if-no-files-found: error

  build-android:
    name: Build Android Client (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --debug --no-pub

      - name: Copy & Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-debug.apk Pulgapp-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulgapp-Android-apk
          path: Pulgapp-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Pulgapp-Server-win-x64

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: Pulgapp-Android-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulgapp-Server-win-x64.zip
            Pulgapp-Android.apk
          generate_release_notes: true
          draft: false
          prerelease: false
